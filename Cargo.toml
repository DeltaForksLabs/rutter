[package]
name    = "rutter"
version = "0.40.0"
edition = "2024"
# Let-chains used by the engine and hit-testing require Rust 1.88 (stabilized
# there); declared so older toolchains fail with a clear message instead of a
# syntax error.
rust-version = "1.88"
license = "MIT OR Apache-2.0"
description = "High-performance Rust UI framework featuring Skia rendering (Vulkan/OpenGL), Taffy flexbox layouts, and advanced typography."
authors = ["Paulo Daniel <paulodanielpro@proton.me>"]
repository = "https://github.com/DeltaForksLabs/rutter"
keywords = ["rutter", "graphics", "gui"]
readme = "README.md"

[dependencies]
winit       = { version = "=0.31.0-beta.3", path = "vendor/rutter-winit/winit" }
taffy       = "0.10.1"
skia-safe   = { version = "0.93.1", features = ["gl", "svg", "vulkan", "textlayout"] }
cosmic-text = "0.18.2"
arboard     = "3.6.1"
chrono      = { version = "0.4", default-features = false, features = ["clock"] }
chrono-tz   = "0.10.4"
accesskit   = "0.25.1"
accesskit_winit = { version = "=0.34.1", path = "vendor/rutter-accesskit-winit" }
fluent      = "0.17.0"
unic-langid = "0.9.6"
unicode-segmentation = "1.12.0"
# Decoder opcional via image-rs; Skia é o decoder padrão do Rutter.
image       = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp"], optional = true }
# --- Backend Vulkan ---
ash = "0.38.0"
ash-window = "0.13.0"

# --- Backend OpenGL ---
glutin = "0.32.3"
glutin-winit = { version = "=0.5.0", path = "vendor/rutter-glutin-winit" }
raw-window-handle = "0.6.2"

# --- Backend CPU ---
softbuffer  = "0.4.8"
zeroize     = "1.8.2"

[target.'cfg(target_os = "linux")'.dev-dependencies]
# Native X11 integration exercises a real Rutter widget with XTEST input.
x11rb = { version = "0.13.2", features = ["xtest"] }

[lib]
crate-type = ["rlib", "cdylib"]

[features]
default = []
image-rs-decoder = ["dep:image"]

[profile.dev-opt]
inherits  = "dev"
opt-level = 1
debug     = true

[profile.release]
opt-level     = 3
lto           = true      # Link-Time Optimization (elimina código morto entre crates)
codegen-units = 1         # Uma única unidade: permite otimizações globais
panic         = "unwind"  # Permite que recursos e dados sensíveis sejam liberados em falhas controladas
strip         = true      # Remove símbolos do binário final
incremental   = false     # Compilações reproduzíveis (importante para binário setuid)
