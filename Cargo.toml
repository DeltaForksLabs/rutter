[package]
name    = "rutter"
version = "0.8.1"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "High-performance Rust UI framework featuring Skia rendering (Vulkan/OpenGL), Taffy flexbox layouts, and advanced typography."
repository = "https://github.com/DeltaForksLabs/rutter"
readme = "README.md"
keywords = ["rutter", "graphics", "gui"]

[dependencies]
winit       = "0.30.13"
taffy       = "0.10.1"
skia-safe   = { version = "0.93.1", features = ["gl", "vulkan", "textlayout"] }
cosmic-text = "0.18.2"
arboard     = "3.6.1"
# Fase 3: decodificação de imagens PNG/JPEG/WebP
image       = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp"] }
# --- Backend Vulkan ---
ash = "0.38.0"
ash-window = "0.13.0"

# --- Backend OpenGL ---
gl = "0.14.0"
glutin = "0.32.3"
glutin-winit = "0.5.0"
raw-window-handle = "0.6.2"

# --- Backend CPU ---
softbuffer  = "0.4.8"

[dev-dependencies]
# sem deps extras — testes usam apenas a stdlib + deps acima

[features]
default = []

[profile.dev-opt]
inherits  = "dev"
opt-level = 1
debug     = true

[profile.release]
opt-level     = "s"       # Otimiza para tamanho binário
lto           = true      # Link-Time Optimization (elimina código morto entre crates)
codegen-units = 1         # Uma única unidade: permite otimizações globais
panic         = "abort"   # Sem overhead de unwinding — adequado para binário de sistema
strip         = true      # Remove símbolos do binário final
incremental   = false     # Compilações reproduzíveis (importante para binário setuid)
